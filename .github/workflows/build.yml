name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      # Optional: set this repository secret to build Microsoft sign-in into the executable
      SCALERI_MSA_CLIENT_ID: ${{ secrets.MSA_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Scaleri-Windows-x64
          path: target/release/scaleri.exe
