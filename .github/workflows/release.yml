name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      SCALERI_MSA_CLIENT_ID: ${{ secrets.MSA_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/scaleri.exe dist/Scaleri.exe
          cp LICENSE dist/
          cd dist && 7z a ../Scaleri-Windows-x64-${GITHUB_REF_NAME}.zip Scaleri.exe LICENSE

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Scaleri ${{ github.ref_name }}
          files: |
            dist/Scaleri.exe
            Scaleri-Windows-x64-${{ github.ref_name }}.zip
