name: Scaleri Client

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: scaleri-client
          path: |
            client/build/libs/*.jar
            !client/build/libs/*-sources.jar

      - name: Install headless OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      # Boots the real game under a virtual display, applies every mixin, opens every
      # Scaleri screen and quits. A mixin that no longer matches Minecraft crashes here.
      - name: Smoke test in game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PsmokeTest --no-daemon 2>&1 | tee smoke.log
          grep -q SCALERI_SMOKE_OK smoke.log

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: |
            client/smoke.log
            client/run/logs/
            client/run/crash-reports/
          if-no-files-found: ignore
