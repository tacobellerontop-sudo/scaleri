[package]
name = "scaleri"
version = "0.1.0"
edition = "2021"
description = "A lightweight Minecraft launcher for Windows"
license = "GPL-3.0-only"
repository = "https://github.com/tacobellerontop-sudo/scaleri"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
md-5 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
dirs = "7"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
